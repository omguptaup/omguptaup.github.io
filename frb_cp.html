<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnetar Wind Polarization Plotter</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0; padding: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        h1 { text-align: center; color: #2c3e50; }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .sidebar {
            flex: 1;
            min-width: 300px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .main-content {
            flex: 2;
            min-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px;}
        input[type="number"], input[type="text"], select {
            width: 100%; padding: 8px; box-sizing: border-box;
            border: 1px solid #ccc; border-radius: 4px;
        }
        .stokes-group {
            background: #eef2f3; padding: 15px; border-radius: 8px; margin-bottom: 15px;
        }
        button {
            background-color: #3498db; color: white; border: none;
            padding: 10px 15px; font-size: 16px; border-radius: 5px;
            cursor: pointer; width: 100%; margin-top: 10px;
        }
        button:hover { background-color: #2980b9; }
        .btn-secondary { background-color: #95a5a6; margin-top: 5px;}
        .btn-secondary:hover { background-color: #7f8c8d; }
        
        #plot-div {
            background: #fff; padding: 20px; border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            min-height: 500px; width: 100%;
        }
        #warning-div {
            background: #f39c12; color: white; padding: 15px;
            border-radius: 8px; display: none; font-weight: bold;
        }
        #loading {
            text-align: center; font-weight: bold; font-size: 18px;
            color: #2980b9; display: none; margin-top: 20px;
        }
    </style>
</head>
<body>

<h1>Magnetar Wind Polarization Plotter</h1>

<div class="container">
    <!-- INPUT SIDEBAR -->
    <div class="sidebar">
        <h3>Simulation Parameters</h3>
        <div class="form-group"><label>nu_start</label><input type="number" id="nu_start" value="1.0e9"></div>
        <div class="form-group"><label>nu_end</label><input type="number" id="nu_end" value="1.1e9"></div>
        <div class="form-group"><label>nu_points</label><input type="number" id="nu_points" value="101"></div>
        <div class="form-group"><label>wind_mag0</label><input type="number" id="wind_mag0" value="10000.0"></div>
        <div class="form-group"><label>gamma0</label><input type="number" id="gamma0" value="10.0"></div>
        <div class="form-group"><label>mugamma</label><input type="number" id="mugamma" value="1.0"></div>
        <div class="form-group"><label>iload</label><input type="number" id="iload" value="0.001" step="0.001"></div>
        <div class="form-group"><label>phi_B</label><input type="number" id="phi_B" value="0.0"></div>
        <div class="form-group"><label>L_frb</label><input type="number" id="L_frb" value="1e40"></div>
        <div class="form-group"><label>L_wind_37</label><input type="number" id="L_wind_37" value="10.0"></div>
        <div class="form-group">
            <label>nframes (Max 200)</label>
            <input type="number" id="nframes" value="100" min="1" max="200" step="1">
        </div>
        <div class="form-group">
            <label>Choice</label>
            <select id="choice">
                <option value="1">Stokes Q, U, V</option>
                <option value="2" selected>PA, EA</option>
            </select>
        </div>

        <div class="stokes-group">
            <h4>Initial Stokes Parameters</h4>
            <div class="form-group"><label>Q_in</label><input type="number" id="Q_in" value="0.7" step="0.001"></div>
            <div class="form-group"><label>U_in</label><input type="number" id="U_in" value="0.7141428" step="0.001"></div>
            <div class="form-group"><label>V_in</label><input type="number" id="V_in" value="0.0" step="0.001"></div>
            <button type="button" class="btn-secondary" onclick="resolveStokes()">Resolve Stokes</button>
        </div>

        <button onclick="runSimulation()">Run Simulation</button>
    </div>

    <!-- OUTPUT AREA -->
    <div class="main-content">
        <div id="warning-div"></div>
        <div id="loading">Sending parameters to the server and computing... Please wait.</div>
        <div id="plot-div"></div>
    </div>
</div>

<script>
    // 1. Logic to resolve Stokes Parameters
    function resolveStokes() {
        let qStr = document.getElementById('Q_in').value;
        let uStr = document.getElementById('U_in').value;
        let vStr = document.getElementById('V_in').value;
        
        let q = qStr ? parseFloat(qStr) : NaN;
        let u = uStr ? parseFloat(uStr) : NaN;
        let v = vStr ? parseFloat(vStr) : NaN;

        let filled = [];
        if (!isNaN(q)) filled.push('q');
        if (!isNaN(u)) filled.push('u');
        if (!isNaN(v)) filled.push('v');

        if (filled.length === 2) {
            let sumSq = 0;
            if (filled.includes('q')) sumSq += q*q;
            if (filled.includes('u')) sumSq += u*u;
            if (filled.includes('v')) sumSq += v*v;

            if (sumSq > 1.0) {
                alert("Error: The sum of the squares of the provided values exceeds 1.");
                return;
            }

            let remainder = Math.sqrt(1.0 - sumSq);
            
            if (!filled.includes('q')) document.getElementById('Q_in').value = remainder.toFixed(7);
            if (!filled.includes('u')) document.getElementById('U_in').value = remainder.toFixed(7);
            if (!filled.includes('v')) document.getElementById('V_in').value = remainder.toFixed(7);
            
            alert("Missing parameter calculated assuming total polarization = 1");
        } 
        else if (filled.length === 3) {
            let sumSq = q*q + u*u + v*v;
            if (sumSq > 1.00001) { // slight margin for floating point error
                alert(`Warning: Total polarization Q² + U² + V² = ${sumSq.toFixed(5)} (Exceeds 1!)`);
            } else {
                alert(`Stokes values are valid. Total polarization = ${sumSq.toFixed(5)}`);
            }
        } 
        else {
            alert("Please provide exactly two values to resolve the third.");
        }
    }

    async function runSimulation() {
        // Validate max frames
        let nframes = parseInt(document.getElementById('nframes').value);
        if (nframes > 200) {
            alert("nframes cannot exceed 200.");
            return;
        }

        // Build Payload
        const payload = {
            nu_start: parseFloat(document.getElementById('nu_start').value),
            nu_end: parseFloat(document.getElementById('nu_end').value),
            nu_points: parseInt(document.getElementById('nu_points').value),
            wind_mag0: parseFloat(document.getElementById('wind_mag0').value),
            gamma0: parseFloat(document.getElementById('gamma0').value),
            mugamma: parseFloat(document.getElementById('mugamma').value),
            iload: parseFloat(document.getElementById('iload').value),
            phi_B: parseFloat(document.getElementById('phi_B').value),
            L_frb: parseFloat(document.getElementById('L_frb').value),
            L_wind_37: parseFloat(document.getElementById('L_wind_37').value),
            nframes: nframes,
            choice: parseInt(document.getElementById('choice').value),
            Q_in: parseFloat(document.getElementById('Q_in').value),
            U_in: parseFloat(document.getElementById('U_in').value),
            V_in: parseFloat(document.getElementById('V_in').value)
        };

        const loadingDiv = document.getElementById('loading');
        const warningDiv = document.getElementById('warning-div');
        
        loadingDiv.style.display = 'block';
        warningDiv.style.display = 'none';
        loadingDiv.innerText = "Submitting execution to TACC... This may take a moment.";
        Plotly.purge('plot-div'); // Clear previous plot

        try {
            // NOTE: Change this URL to your live Render proxy URL (e.g., https://your-app.onrender.com/run-simulation)
            const response = await fetch("https://omguptaup-github-io.onrender.com/run_simulation", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            
            const data = await response.json();
            
            if (data.status !== "success") {
                throw new Error(data.message || "Failed to process simulation on the server.");
            }

            // Display Warning if any
            if (data.warning) {
                warningDiv.innerText = data.warning;
                warningDiv.style.display = 'block';
            }

            // Render Plotly graph directly from the proxy's parsed JSON
            loadingDiv.style.display = 'none';
            Plotly.newPlot('plot-div', data.plotData.data, data.plotData.layout);

        } catch (error) {
            loadingDiv.style.display = 'none';
            warningDiv.style.display = 'block';
            warningDiv.innerText = "Error: " + error.message;
            console.error(error);
        }
    }
</script>

</body>
</html>
